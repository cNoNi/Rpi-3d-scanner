<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3D Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <header>
        <h1>3D Scanner</h1>
        <span id="connection" class="badge badge-off">Connecting…</span>
    </header>

    <section class="card">
        <h2>Scan</h2>
        <div class="progress"><div id="progress-bar"></div></div>
        <p id="progress-text">0 / 0</p>
        <div class="row">
            <button id="scan-start" class="primary">Start scan</button>
            <button id="scan-stop" class="danger">Stop</button>
        </div>
    </section>

    <section class="card">
        <h2>Manual control</h2>
        <div class="row">
            <button id="motor-ccw" title="Rotate counter-clockwise">⟲ CCW</button>
            <button id="photo">Take photo</button>
            <button id="motor-cw" title="Rotate clockwise">CW ⟳</button>
        </div>
    </section>

    <section class="card">
        <h2>Status</h2>
        <dl>
            <dt>Phone</dt><dd id="phone">–</dd>
            <dt>State</dt><dd id="state">–</dd>
        </dl>
        <p id="message" class="message" hidden></p>
    </section>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
